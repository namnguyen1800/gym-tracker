<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14161d">
<title>Gym Tracker</title>
<style>
  :root{
    --bg1:#14161d; --bg2:#1b1e27;
    --surface:#1b1e27;
    --text:#eef1f7; --muted:#8a93a6;
    --shadow-dark:rgba(0,0,0,0.55);
    --shadow-light:rgba(255,255,255,0.045);
    --accent:#60a5fa;
    --accent-soft:rgba(96,165,250,0.16);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:
      radial-gradient(900px 600px at 50% -12%, #232833 0%, transparent 60%),
      radial-gradient(700px 500px at 100% 110%, #1d2230 0%, transparent 55%),
      var(--bg1);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    min-height:100vh;
    padding-bottom:90px;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Neumorphic primitives ---------- */
  .neo{
    background:var(--surface);
    border-radius:20px;
    box-shadow:
      8px 8px 20px var(--shadow-dark),
      -8px -8px 20px var(--shadow-light);
  }
  .neo-inset{
    background:var(--surface);
    border-radius:16px;
    box-shadow:
      inset 6px 6px 14px var(--shadow-dark),
      inset -6px -6px 14px var(--shadow-light);
  }

  header{
    padding:14px 16px 10px;
    background:rgba(20,22,29,0.85);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(255,255,255,0.05);
  }
  .head-top{display:flex; align-items:center; justify-content:space-between;}
  h1{font-size:21px; margin:0; font-weight:800; letter-spacing:.3px;}
  h1 .dot{color:var(--accent);}
  .sub{color:var(--muted); font-size:12px; margin-top:2px;}

  .view-toggle{display:flex; gap:8px;}
  .vt-btn{
    border:none; border-radius:12px; padding:8px 15px; font-size:13px; font-weight:700;
    background:var(--surface); color:var(--muted); cursor:pointer;
    box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
    transition:color .15s;
  }
  .vt-btn.on{color:#fff; box-shadow: inset 4px 4px 10px var(--shadow-dark), inset -4px -4px 10px var(--shadow-light);}

  /* Day tabs */
  .tabs{display:flex; gap:10px; margin-top:14px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:1; min-width:92px; text-align:center; padding:12px 6px; border-radius:14px;
    background:var(--surface); color:var(--muted); cursor:pointer;
    font-size:13px; font-weight:700; white-space:nowrap;
    box-shadow: 5px 5px 12px var(--shadow-dark), -5px -5px 12px var(--shadow-light);
    transition:box-shadow .15s;
  }
  .tab .dow{display:block; font-size:10px; font-weight:500; opacity:.65; margin-top:2px;}
  .tab.on{
    color:#fff;
    box-shadow: inset 5px 5px 12px var(--shadow-dark), inset -5px -5px 12px var(--shadow-light);
  }
  .tab .emoji{margin-right:4px;}

  main{padding:16px 16px 0; max-width:560px; margin:0 auto;}

  /* ---------- Workout view ---------- */
  .day-title{font-size:15px; margin:2px 0 14px; color:var(--text); font-weight:600; text-align:center;}
  .day-title span{color:var(--muted); font-weight:500;}

  .ex-progress{display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:16px;}
  .ex-count{font-size:13px; color:var(--muted); font-weight:600;}
  .ex-count b{color:var(--text);}
  .ex-dots{display:flex; gap:7px;}
  .xdot{width:9px; height:9px; border-radius:50%; background:var(--bg2); box-shadow: inset 2px 2px 4px var(--shadow-dark);}
  .xdot.on{background:var(--accent); box-shadow: 0 0 8px var(--accent);}
  .xdot.done{background:var(--accent); opacity:.55;}

  /* Exercise card */
  .ex{
    border-radius:26px; padding:20px 18px; margin-bottom:14px;
    background:var(--surface);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.06),
      12px 12px 28px var(--shadow-dark),
      -12px -12px 28px var(--shadow-light);
  }

  /* Sticky exercise header (name + highest/last) */
  .ex-sticky{
    position:sticky; top:0; z-index:15;
    background:var(--surface);
    padding:14px 0 12px; margin:0 0 12px;
    border-bottom:1px solid rgba(255,255,255,0.06);
    text-align:center;
  }
  .es-name{font-size:22px; font-weight:800; line-height:1.25; letter-spacing:.2px;}
  .es-stat{color:var(--muted); font-size:15px; font-weight:700; margin-top:5px;}
  .es-stat b{color:var(--text); font-size:17px;}
  .es-done{color:#34d399; font-weight:800;}

  .ex-head{text-align:center;}
  .ex-idx{
    display:inline-block; font-size:12px; font-weight:800; letter-spacing:1px; color:var(--accent);
    background:var(--accent-soft); padding:3px 12px; border-radius:20px; margin-bottom:8px;
  }
  .ex-name{font-size:24px; font-weight:800; line-height:1.2; letter-spacing:.2px;}
  .ex-meta{color:var(--muted); font-size:16px; font-weight:700; margin-top:6px;}

  /* Weight stepper */
  .weight-row{display:flex; align-items:center; justify-content:center; gap:14px; margin:18px 0 6px;}
  .wbtn{
    width:52px; height:52px; border-radius:16px; border:none; cursor:pointer;
    background:var(--surface); color:var(--text); font-size:24px; font-weight:800;
    box-shadow: 6px 6px 14px var(--shadow-dark), -6px -6px 14px var(--shadow-light);
    transition:box-shadow .08s, transform .08s;
  }
  .wbtn:active{ box-shadow: inset 5px 5px 12px var(--shadow-dark), inset -5px -5px 12px var(--shadow-light); transform:scale(.96); }
  .wval{font-size:26px; font-weight:900; min-width:110px; text-align:center; letter-spacing:.5px;}
  .wunit{color:var(--muted); font-size:14px; font-weight:600;}
  .wsub{color:var(--muted); font-size:12px; text-align:center; margin-top:2px;}

  /* Set dots */
  .sets{display:flex; gap:8px; justify-content:center; margin:14px 0;}
  .set{
    flex:0 0 auto; min-width:54px; padding:8px 4px; border-radius:14px;
    background:var(--surface); text-align:center;
    box-shadow: 5px 5px 12px var(--shadow-dark), -5px -5px 12px var(--shadow-light);
  }
  .set .sl{font-size:13px; font-weight:800; letter-spacing:.3px; color:var(--muted);}
  .set .rv{font-size:18px; font-weight:900; margin-top:2px;}
  .set.cur .sl{color:var(--accent);}
  .set.filled{box-shadow: inset 5px 5px 12px var(--shadow-dark), inset -5px -5px 12px var(--shadow-light);}
  .set.filled .rv{color:var(--accent);}

  /* Big display */
  .big-display{
    text-align:center; padding:22px 16px; border-radius:24px; margin:6px 0 16px;
    background:
      radial-gradient(140px 70px at 50% 0%, rgba(255,255,255,0.08), transparent 70%),
      var(--surface);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.06),
      inset 8px 8px 18px var(--shadow-dark),
      inset -8px -8px 18px var(--shadow-light);
  }
  .set-label{
    font-size:58px; font-weight:900; line-height:1.05; letter-spacing:1px;
    background:linear-gradient(180deg,#ffffff 0%, #aeb7c8 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .set-stat{font-size:14px; color:var(--muted); margin-top:8px; font-weight:600;}
  .set-stat b{color:var(--text);}

  /* Rep buttons */
  .rep-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  .rep-btn{
    height:68px; border:none; border-radius:16px; cursor:pointer;
    background:var(--surface); color:var(--text); font-size:23px; font-weight:900;
    box-shadow: 7px 7px 16px var(--shadow-dark), -7px -7px 16px var(--shadow-light);
    transition:box-shadow .07s, transform .07s;
  }
  .rep-btn:active{
    box-shadow: inset 6px 6px 13px var(--shadow-dark), inset -6px -6px 13px var(--shadow-light);
    transform:scale(.96); color:var(--accent);
  }

  .custom-row{display:flex; gap:10px; margin-top:14px; align-items:stretch;}
  .custom-input{
    flex:1; min-width:0; height:54px; border:none; border-radius:16px; background:var(--surface);
    color:var(--text); font-size:18px; font-weight:700; padding:0 14px; text-align:center;
    box-shadow: inset 6px 6px 13px var(--shadow-dark), inset -6px -6px 13px var(--shadow-light);
    outline:none;
  }
  .cstep{
    width:52px; height:54px; border:none; border-radius:16px; cursor:pointer;
    background:var(--surface); color:var(--text); font-size:24px; font-weight:800;
    box-shadow: 6px 6px 14px var(--shadow-dark), -6px -6px 14px var(--shadow-light);
  }
  .cstep:active{ box-shadow: inset 5px 5px 12px var(--shadow-dark), inset -5px -5px 12px var(--shadow-light); transform:scale(.96); }
  .ok-btn{
    width:70px; height:54px; border:none; border-radius:16px; cursor:pointer;
    background:var(--accent); color:#0b0e14; font-size:16px; font-weight:900;
    box-shadow: 0 6px 14px rgba(0,0,0,0.4);
  }
  .ok-btn:active{transform:scale(.96);}

  .delete-btn{
    width:100%; margin-top:12px; height:48px; border:none; border-radius:14px; cursor:pointer;
    background:transparent; color:var(--muted); font-size:14px; font-weight:700;
    box-shadow: 5px 5px 12px var(--shadow-dark), -5px -5px 12px var(--shadow-light);
  }
  .delete-btn:active{ box-shadow: inset 5px 5px 12px var(--shadow-dark), inset -5px -5px 12px var(--shadow-light); color:#f87171; }

  /* Nav */
  .nav-row{display:flex; gap:12px; margin:4px 0 8px;}
  .nav-btn{
    flex:1; height:56px; border:none; border-radius:16px; cursor:pointer;
    background:var(--surface); color:var(--text); font-size:16px; font-weight:800;
    box-shadow: 7px 7px 16px var(--shadow-dark), -7px -7px 16px var(--shadow-light);
  }
  .nav-btn:active{ box-shadow: inset 6px 6px 13px var(--shadow-dark), inset -6px -6px 13px var(--shadow-light); }
  .nav-btn:disabled{opacity:.3;}

  .done-banner{
    border-radius:20px; padding:16px; text-align:center; font-size:17px; font-weight:800; margin-bottom:14px;
    background:rgba(52,211,153,0.12); color:#34d399;
    box-shadow: inset 0 0 0 1px rgba(52,211,153,0.4);
  }

  /* ---------- History view ---------- */
  #historyView{display:none;}
  .filter-row{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .chip{
    background:var(--surface); color:var(--muted); border-radius:20px; padding:8px 14px;
    font-size:12px; font-weight:700; cursor:pointer;
    box-shadow: 4px 4px 10px var(--shadow-dark), -4px -4px 10px var(--shadow-light);
  }
  .chip.on{color:#fff; box-shadow: inset 4px 4px 10px var(--shadow-dark), inset -4px -4px 10px var(--shadow-light);}
  .hist-ex{border-radius:18px; margin-bottom:12px; overflow:hidden; background:var(--surface); box-shadow: 6px 6px 16px var(--shadow-dark), -6px -6px 16px var(--shadow-light);}
  .hist-ex-head{padding:13px 15px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;}
  .hist-ex-head .n{font-weight:700; font-size:14px;}
  .hist-ex-head .c{color:var(--muted); font-size:12px;}
  .hist-body{display:none; border-top:1px solid rgba(255,255,255,0.06);}
  .hist-ex.open .hist-body{display:block;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{padding:9px 6px; text-align:center; border-bottom:1px solid rgba(255,255,255,0.05);}
  th{color:var(--muted); font-weight:600; font-size:11px;}
  td.rep{font-weight:800;}
  .trend-up{color:#34d399;} .trend-down{color:#f87171;} .trend-same{color:var(--muted);}
  .empty{color:var(--muted); text-align:center; padding:30px 10px; font-size:14px;}
  .prog-hint{
    border-radius:16px; padding:12px 14px; margin-top:12px; text-align:center;
    font-size:14px; font-weight:700; color:#fbbf24;
    background:rgba(251,191,36,0.10);
    box-shadow: inset 0 0 0 1px rgba(251,191,36,0.35);
  }
  .data-row{display:flex; gap:12px; margin-top:22px;}

  /* ---------- Rest timer overlay ---------- */
  #restOverlay{
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column; align-items:center;
    justify-content:center;
    gap:28px;
    padding:15vh 20px 15vh;
    background:rgba(10,12,17,0.96);
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  #restOverlay.show{ opacity:1; pointer-events:auto; }
  .rest-top{ text-align:center; }
  .rest-tag{ font-size:15px; font-weight:700; color:var(--muted); letter-spacing:3px; text-transform:uppercase; }
  .rest-num{
    font-size:130px; font-weight:900; line-height:1; margin:8px 0;
    background:linear-gradient(180deg,#ffffff 0%, #aeb7c8 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .rest-bottom{ width:100%; max-width:380px; display:flex; flex-direction:column; gap:16px; }
  .rest-info{
    text-align:center; background:var(--surface); border-radius:18px; padding:16px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 8px 8px 20px rgba(0,0,0,0.4);
  }
  .rest-info-name{ font-size:19px; font-weight:800; }
  .rest-info-sub{ color:var(--muted); font-size:14px; font-weight:700; margin-top:4px; }
  .rest-info-hl{ font-size:14px; margin-top:8px; color:var(--muted); }
  .rest-info-hl b{ color:var(--text); font-size:16px; }
  .rest-skip{
    padding:15px 34px; border:none; border-radius:16px;
    background:var(--surface); color:var(--text); font-size:16px; font-weight:800; cursor:pointer;
    box-shadow: 7px 7px 16px var(--shadow-dark), -7px -7px 16px var(--shadow-light);
  }
  .rest-skip:active{ box-shadow: inset 6px 6px 13px var(--shadow-dark), inset -6px -6px 13px var(--shadow-light); }
/* ===== fireworks (new record) ===== */
#fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999;display:block;}
.fw-banner{position:fixed;top:50%;transform:translateY(-50%);left:0;right:0;text-align:center;pointer-events:none;z-index:10000;display:none;}
.fw-banner h1{font-size:44px;font-weight:900;color:#fff;margin:0;text-shadow:0 0 24px rgba(255,190,80,0.85);animation:fwpop .5s cubic-bezier(.2,1.6,.4,1);}
.fw-banner .fw-sub{color:#fbbf24;font-size:20px;font-weight:800;margin-top:8px;letter-spacing:3px;text-shadow:0 0 14px rgba(251,191,36,0.6);}
@keyframes fwpop{0%{transform:scale(.25);opacity:0}100%{transform:scale(1);opacity:1}}
</style>

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<body>
<header>
  <div class="head-top">
    <div>
      <h1>ðŸ’ª Gym<span class="dot">.</span>Tracker</h1>
      <div class="sub" id="todayLabel"></div>
    </div>
    <div class="view-toggle">
      <button id="btnWorkout" class="vt-btn on" onclick="setView('workout')">Workout</button>
      <button id="btnHistory" class="vt-btn" onclick="setView('history')">Progress</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <div id="workoutView">
    <div class="day-title" id="dayTitle"></div>
    <div id="workoutList"></div>
  </div>
  <div id="historyView">
    <div class="filter-row" id="histFilter"></div>
    <div id="historyList"></div>
    <div class="data-row">
      <button class="nav-btn" onclick="backupData()">ðŸ’¾ Backup</button>
      <button class="nav-btn" onclick="document.getElementById('importFile').click()">â¬†ï¸ Import</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importData(event)">
    </div>
  </div>
</main>

<div id="restOverlay">
  <div class="rest-top">
    <div class="rest-tag">Rest</div>
    <div class="rest-num" id="restNum">60</div>
  </div>
  <div class="rest-bottom">
    <div class="rest-info" id="restInfo"></div>
    <button class="rest-skip" onclick="skipRest()">Skip â€º</button>
  </div>
</div>

<script>
const DAY_ORDER = ['monday','tuesday','wednesday','thursday'];

const PLAN = {
  monday:{
    label:'MONDAY', emoji:'ðŸŸ¢', color:'#34d399', title:'Chest + Rear Delts',
    exercises:[
      {name:'Dumbbell Bench Press', sets:4, weight:50, type:'reps'},
      {name:'Incline Dumbbell Press', sets:3, weight:40, type:'reps'},
      {name:'Rear Delt Fly (Bench)', sets:3, weight:30, type:'reps'},
      {name:'Dumbbell Lateral Raise', sets:3, weight:25, type:'reps'},
    ]
  },
  tuesday:{
    label:'TUESDAY', emoji:'ðŸ”µ', color:'#60a5fa', title:'Back + Biceps',
    exercises:[
      {name:'One-Arm Dumbbell Row', sets:4, weight:55, type:'reps'},
      {name:'Chest-Supported Dumbbell Row', sets:3, weight:45, type:'reps'},
      {name:'Dumbbell Romanian Deadlift (RDL)', sets:3, weight:40, type:'reps'},
      {name:'Hammer Curl', sets:3, weight:35, type:'reps'},
    ]
  },
  wednesday:{
    label:'WEDNESDAY', emoji:'ðŸŸ¡', color:'#fbbf24', title:'Legs + Core',
    exercises:[
      {name:'Goblet Squat', sets:4, weight:55, type:'reps'},
      {name:'Dumbbell Bulgarian Split Squat', sets:3, weight:0, type:'reps'},
      {name:'Seated Bench Crunch', sets:3, weight:0, type:'reps'},
      {name:'Standing Calf Raise', sets:3, weight:25, type:'reps'},
      {name:'Plank', sets:2, weight:0, type:'time', rest:90},
    ]
  },
  thursday:{
    label:'THURSDAY', emoji:'ðŸŸ£', color:'#c084fc', title:'Shoulders + Arms',
    exercises:[
      {name:'Dumbbell Shoulder Press', sets:4, weight:40, type:'reps'},
      {name:'Dumbbell Lateral Raise', sets:3, weight:20, type:'reps'},
      {name:'Tricep Kickback', sets:3, weight:25, type:'reps'},
      {name:'Standard Dumbbell Curl', sets:3, weight:20, type:'reps'},
    ]
  }
};

function seedHistory(){
  const h = {};
  const add = (day, name, date, weight, reps) => {
    const k = day+'|'+name;
    (h[k] = h[k]||[]).push({date, weight, reps});
  };
  add('monday','Dumbbell Bench Press','8/17',50,[12,12,11,11]);
  add('monday','Incline Dumbbell Press','8/17',40,[11,11,11]);
  add('monday','Rear Delt Fly (Bench)','5/11',30,[0]);
  add('monday','Dumbbell Lateral Raise','7/20',25,[0]);
  add('tuesday','One-Arm Dumbbell Row','6/16',55,[12,11,8]);
  add('tuesday','Chest-Supported Dumbbell Row','8/4',45,[11,10,9]);
  add('tuesday','Dumbbell Romanian Deadlift (RDL)','8/11',40,[12]);
  add('tuesday','Hammer Curl','6/30',35,[28,24]);
  add('wednesday','Goblet Squat','5/5',55,[12]);
  add('wednesday','Dumbbell Bulgarian Split Squat','7/1',0,[12]);
  add('wednesday','Standing Calf Raise','7/15',25,[14]);
  add('wednesday','Seated Bench Crunch',null,0,[12]);
  add('wednesday','Plank',null,0,['30s','45s']);
  add('thursday','Dumbbell Shoulder Press','8/13',40,[12,11,9,9]);
  add('thursday','Dumbbell Lateral Raise','8/6',20,[13,12,11]);
  add('thursday','Tricep Kickback','8/13',25,[13,12,12]);
  add('thursday','Standard Dumbbell Curl','8/6',20,[13,12]);
  return h;
}

const STORE_KEY = 'gym_tracker_nam_v2';

function defaultState(){
  const weights = {};
  for(const day of DAY_ORDER){
    for(const ex of PLAN[day].exercises){
      weights[day+'|'+ex.name] = ex.weight;
    }
  }
  return {
    weights,
    history: seedHistory(),
    progress: {},
    customReps: {},
    activeDay: DAY_ORDER[0],
    activeEx: {monday:0, tuesday:0, wednesday:0, thursday:0}
  };
}

let state;
try{
  const raw = localStorage.getItem(STORE_KEY);
  state = raw ? JSON.parse(raw) : defaultState();
  if(!state.weights) state.weights = defaultState().weights;
  if(!state.history) state.history = seedHistory();
  if(!state.progress) state.progress = {};
  if(!state.customReps) state.customReps = {};
  if(!state.activeDay) state.activeDay = DAY_ORDER[0];
  if(!state.activeEx) state.activeEx = {monday:0, tuesday:0, wednesday:0, thursday:0};
}catch(e){
  state = defaultState();
}

function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

// migrate old M/D dates (no year) -> YYYY/M/D (one-time)
(function(){
  const y = new Date().getFullYear();
  let changed = false;
  for(const k in state.history){
    for(const en of state.history[k]){
      if(en.date && /^\d{1,2}\/\d{1,2}$/.test(en.date)){
        en.date = y + '/' + en.date;
        changed = true;
      }
    }
  }
  if(changed) save();
})();

function key(day,name){ return day+'|'+name; }

function todayMMDD(){
  const d = new Date();
  return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate();
}

function todayDow(){
  const d = new Date().getDay();
  return ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'][d];
}

function autoDay(){
  const d = todayDow();
  return DAY_ORDER.includes(d) ? d : 'monday';
}

function lastEntry(day,name){
  const h = state.history[key(day,name)]||[];
  return h[h.length-1]||null;
}

function isExDoneToday(day,name){
  const h = state.history[key(day,name)]||[];
  const last = h[h.length-1];
  return !!(last && last.date === todayMMDD());
}

function setStats(day,name,setIndex,weight){
  const h = state.history[key(day,name)]||[];
  let highest=null, last=null, highestDate=null;
  const filtered = (weight===undefined || weight===null) ? h : h.filter(en => en.weight === weight);
  for(const en of filtered){
    const v = parseInt(en.reps[setIndex]);
    if(!isNaN(v)){ if(highest===null || v>highest){ highest=v; highestDate=en.date; } }
  }
  const le = filtered[filtered.length-1];
  if(le){
    const lv = parseInt(le.reps[setIndex]);
    if(!isNaN(lv)) last = lv;
  }
  return {highest, last, highestDate};
}

function repSum(reps){
  let n=0;
  for(const r of reps){ const v=parseInt(r); if(!isNaN(v)) n+=v; }
  return n;
}

function setAccent(color){
  document.documentElement.style.setProperty('--accent', color);
  const hex = color.replace('#','');
  const r=parseInt(hex.substr(0,2),16), g=parseInt(hex.substr(2,2),16), b=parseInt(hex.substr(4,2),16);
  document.documentElement.style.setProperty('--accent-soft', 'rgba('+r+','+g+','+b+',0.16)');
}

// ---------- View ----------
function setView(v){
  document.getElementById('workoutView').style.display = v==='workout'?'block':'none';
  document.getElementById('historyView').style.display = v==='history'?'block':'none';
  document.getElementById('btnWorkout').classList.toggle('on', v==='workout');
  document.getElementById('btnHistory').classList.toggle('on', v==='history');
  if(v==='history') renderHistory();
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  for(const day of DAY_ORDER){
    const p = PLAN[day];
    const b = document.createElement('div');
    b.className = 'tab' + (state.activeDay===day?' on':'');
    b.innerHTML = '<span class="emoji">'+p.emoji+'</span>'+p.label+'<span class="dow">'+(day.charAt(0).toUpperCase()+day.slice(1,3))+'</span>';
    b.onclick = ()=>{ state.activeDay=day; save(); renderTabs(); renderWorkout(); };
    tabs.appendChild(b);
  }
}

function renderWorkout(){
  const day = state.activeDay;
  const p = PLAN[day];
  setAccent(p.color);
  document.getElementById('dayTitle').innerHTML = p.emoji+' '+p.label+' <span>â€” '+p.title+'</span>';

  const idx = state.activeEx[day]||0;
  const ex = p.exercises[idx];
  const total = p.exercises.length;
  const list = document.getElementById('workoutList');
  list.innerHTML = '';

  // all done?
  const allDone = isAllDone();

  // progress indicator
  let pr = '<div class="ex-progress"><span class="ex-count"><b>'+(idx+1)+'</b> / '+total+'</span><div class="ex-dots">';
  for(let i=0;i<total;i++){
    let c = 'xdot';
    if(i===idx) c += ' on';
    else if(isExDoneToday(day, p.exercises[i].name)) c += ' done';
    pr += '<span class="'+c+'"></span>';
  }
  pr += '</div></div>';
  list.innerHTML += pr;

  if(allDone){
    const d = document.createElement('div');
    d.className = 'done-banner';
    d.textContent = 'ðŸŽ‰ All done! Great work ðŸ’ª';
    list.prepend(d);
  }

  // exercise card
  const k = key(day, ex.name);
  const prog = state.progress[k]||[];
  const completedToday = isExDoneToday(day, ex.name);
  const done = completedToday || prog.length >= ex.sets;
  const weight = state.weights[k];

  let st = {highest:null, last:null};
  if(ex.type==='reps'){
    st = setStats(day, ex.name, prog.length, weight);
  }

  let card = '<div class="ex" id="exCard">';

  // sticky header: name + highest/last
  let stickyStat = '';
  if(done){
    stickyStat = '<span class="es-done">âœ“ Done</span>';
  }else if(ex.type==='reps'){
    stickyStat = 'highest <b>'+(st.highest!==null?st.highest:'Â·')+'</b> Â· last <b>'+(st.last!==null?st.last:'Â·')+'</b>';
  }else{
    stickyStat = ex.sets+' sets Â· â± time';
  }
  card += '<div class="ex-sticky"><div class="es-name">'+ex.name+'</div><div class="es-stat">'+stickyStat+'</div></div>';

  // weight stepper
  let wr = '<div class="weight-row">';
  wr += '<button class="wbtn" onclick="changeWeight(\''+day+'\',\''+ex.name+'\',-5)">âˆ’</button>';
  wr += '<div><div class="wval">'+(ex.type==='time'?'â±':(weight>0?weight+' <span class="wunit">lbs</span>':'<span class="wunit">body</span>'))+'</div></div>';
  wr += '<button class="wbtn" onclick="changeWeight(\''+day+'\',\''+ex.name+'\',+5)">+</button>';
  wr += '</div>';

  // set dots
  const hist = state.history[k]||[];
  const lastH = hist[hist.length-1];
  let sets = '<div class="sets">';
  for(let s=0;s<ex.sets;s++){
    let cls = 'set';
    let val = 'Â·';
    if(done && lastH && lastH.reps[s]!==undefined){
      cls += ' filled';
      val = lastH.reps[s];
    }else if(s < prog.length){
      cls += ' filled';
      val = prog[s];
    }else if(s === prog.length){
      cls += ' cur';
    }
    sets += '<div class="'+cls+'"><div class="sl">SET '+(s+1)+'</div><div class="rv">'+val+'</div></div>';
  }
  sets += '</div>';

  // big display
  let disp;
  if(done){
    disp = '<div class="big-display"><div class="set-label">âœ“ Done</div></div>';
  }else{
    disp = '<div class="big-display"><div class="set-label">Set '+(prog.length+1)+'</div></div>';
  }

  // rep buttons
  let btns = '<div class="rep-grid">';
  if(ex.type==='time'){
    const opts = ['30s','45s','60s'];
    for(const o of opts){
      btns += '<button class="rep-btn" onclick="logRep(\''+day+'\',\''+ex.name+'\',\''+o+'\')">'+o+'</button>';
    }
  }else{
    for(let r=4;r<=12;r++){
      btns += '<button class="rep-btn" onclick="logRep(\''+day+'\',\''+ex.name+'\','+r+')">'+r+'</button>';
    }
  }
  btns += '</div>';

  // custom input + delete
  const cid = 'ci_'+k.replace(/[^a-z0-9]/gi,'');
  let cx;
  if(ex.type==='time'){
    cx = '<div class="custom-row">'
       + '<input class="custom-input" id="'+cid+'" placeholder="Custom (e.g. 75s)" inputmode="numeric">'
       + '<button class="ok-btn" onclick="logCustom(\''+day+'\',\''+ex.name+'\')">OK</button>'
       + '</div>';
  }else{
    const mem = (state.customReps && state.customReps[k]) || '';
    cx = '<div class="custom-row">'
       + '<button class="cstep" onclick="customRepStep(\''+day+'\',\''+ex.name+'\',-1)">âˆ’</button>'
       + '<input class="custom-input" id="'+cid+'" placeholder="Custom" inputmode="numeric" value="'+mem+'">'
       + '<button class="cstep" onclick="customRepStep(\''+day+'\',\''+ex.name+'\',1)">+</button>'
       + '<button class="ok-btn" onclick="logCustom(\''+day+'\',\''+ex.name+'\')">OK</button>'
       + '</div>';
  }
  cx += '<button class="delete-btn" onclick="deleteRep(\''+day+'\',\''+ex.name+'\')">âŒ« Delete last set</button>';

  card += wr + sets + disp + (done ? progHint(day,ex.name) : '') + btns + cx;
  card += '</div>';
  list.innerHTML += card;

  // nav
  let nav = '<div class="nav-row">';
  nav += '<button class="nav-btn" '+(idx===0?'disabled':'')+' onclick="goEx(-1)">â€¹ Prev</button>';
  nav += '<button class="nav-btn" '+(idx>=total-1?'disabled':'')+' onclick="goEx(1)">Next â€º</button>';
  nav += '</div>';
  list.innerHTML += nav;

  // swipe
  const cardEl = document.getElementById('exCard');
  if(cardEl){
    let sx=0;
    cardEl.addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; }, {passive:true});
    cardEl.addEventListener('touchend', e=>{
      const dx = e.changedTouches[0].clientX - sx;
      if(Math.abs(dx)>50) goEx(dx<0?1:-1);
    }, {passive:true});
  }
}

function goEx(delta){
  const day = state.activeDay;
  const total = PLAN[day].exercises.length;
  let i = (state.activeEx[day]||0) + delta;
  if(i<0) i=0;
  if(i>=total) i=total-1;
  state.activeEx[day] = i;
  save(); renderWorkout();
  window.scrollTo({top:0, behavior:'smooth'});
}

function changeWeight(day,name,delta){
  const k = key(day,name);
  let w = state.weights[k]||0;
  w = Math.max(0, Math.round((w+delta)*10)/10);
  state.weights[k] = w;
  save(); renderWorkout();
}

function logRep(day,name,rep){
  const k = key(day,name);
  const ex = PLAN[day].exercises.find(e=>e.name===name);
  if(!ex) return;
  const prog = state.progress[k]||[];
  if(prog.length >= ex.sets) return;
  prog.push(rep);
  // --- new record fireworks ---
  (function(){
    const _setIdx = prog.length - 1;
    const _hist = state.history[k] || [];
    const _w = state.weights[k];
    let _best = -1;
    for(const _e of _hist){
      if(String(_e.weight) === String(_w) && _e.reps && _e.reps[_setIdx] != null){
        const _v = parseInt(_e.reps[_setIdx]);
        if(!isNaN(_v) && _v > _best) _best = _v;
      }
    }
    const _cur = parseInt(rep);
    if(!isNaN(_cur) && _best >= 0 && _cur > _best){
      launchFireworks(_cur);
    }
  })();
  state.progress[k] = prog;
  let finished = false;
  if(prog.length >= ex.sets){
    const h = state.history[k]||[];
    h.push({date: todayMMDD(), weight: state.weights[k], reps: prog.slice()});
    state.history[k] = h;
    delete state.progress[k];
    finished = true;
  }
  save();
  if(finished){
    const total = PLAN[day].exercises.length;
    let i = state.activeEx[day]||0;
    if(i < total-1) state.activeEx[day] = i+1;
  }
  renderWorkout();
  const allDone = isAllDone();
  if(!allDone){
    if(finished) window.scrollTo({top:0, behavior:'smooth'});
    startRestTimer(ex.rest || 60);
  }
}

function isAllDone(){
  const day = state.activeDay;
  const p = PLAN[day];
  for(const e of p.exercises){
    const k = key(day,e.name);
    const prog = state.progress[k]||[];
    if(prog.length >= e.sets) continue;
    if(isExDoneToday(day, e.name)) continue;
    return false;
  }
  return true;
}

function logCustom(day,name){
  const k = key(day,name);
  const id = 'ci_'+k.replace(/[^a-z0-9]/gi,'');
  const el = document.getElementById(id);
  const v = el.value.trim();
  if(v==='') return;
  if(!state.customReps) state.customReps = {};
  state.customReps[k] = v;
  save();
  logRep(day,name,v);
}

function customRepStep(day,name,delta){
  const k = key(day,name);
  const id = 'ci_'+k.replace(/[^a-z0-9]/gi,'');
  const el = document.getElementById(id);
  let v = parseInt(el.value);
  if(isNaN(v)) v = 12;
  v = Math.max(1, v + delta);
  el.value = v;
  if(!state.customReps) state.customReps = {};
  state.customReps[k] = v;
  save();
}

function deleteRep(day,name){
  const k = key(day,name);
  const prog = state.progress[k]||[];
  if(prog.length>0){ prog.pop(); state.progress[k]=prog; save(); renderWorkout(); }
}

function progHint(day,name){
  const h = state.history[key(day,name)]||[];
  if(h.length===0) return '';
  const last = h[h.length-1];
  if(!last || !last.reps || last.reps.length<3) return '';
  const allTop = last.reps.every(r=>parseInt(r)>=12);
  if(!allTop) return '';
  return '<div class="prog-hint">ðŸŽ¯ 12 reps on all sets â€” add weight next time!</div>';
}

// ---------- History ----------
function allExercises(){
  const out = [];
  for(const day of DAY_ORDER){
    for(const ex of PLAN[day].exercises){ out.push({day,name:ex.name,type:ex.type,sets:ex.sets}); }
  }
  return out;
}

let histFilterDay = 'all';

function renderHistory(){
  const filter = document.getElementById('histFilter');
  filter.innerHTML = '';
  const chips = [['all','All'],['monday','ðŸŸ¢ Mon'],['tuesday','ðŸ”µ Tue'],['wednesday','ðŸŸ¡ Wed'],['thursday','ðŸŸ£ Thu']];
  for(const [v,label] of chips){
    const c = document.createElement('div');
    c.className = 'chip'+(histFilterDay===v?' on':'');
    c.textContent = label;
    c.onclick = ()=>{ histFilterDay=v; renderHistory(); };
    filter.appendChild(c);
  }

  const list = document.getElementById('historyList');
  list.innerHTML = '';
  const exs = allExercises().filter(e => histFilterDay==='all' || e.day===histFilterDay);

  for(const e of exs){
    const h = state.history[key(e.day,e.name)]||[];
    if(h.length===0) continue;

    const wrap = document.createElement('div');
    wrap.className = 'hist-ex';
    const entries = h.slice().reverse();
    const last = entries[0];
    const prev = entries[1];

    let trend = '';
    if(prev && e.type==='reps'){
      const a = repSum(last.reps), b = repSum(prev.reps);
      if(a>b) trend = '<span class="trend-up">â–² +'+(a-b)+'</span>';
      else if(a<b) trend = '<span class="trend-down">â–¼ '+(a-b)+'</span>';
      else trend = '<span class="trend-same">=</span>';
    }

    const head = document.createElement('div');
    head.className = 'hist-ex-head';
    head.innerHTML = '<div><span class="n">'+PLAN[e.day].emoji+' '+e.name+'</span><br><span class="c">'+entries.length+' sessions Â· last '+last.date+'</span></div><div class="c">'+trend+'</div>';
    head.onclick = ()=> wrap.classList.toggle('open');
    wrap.appendChild(head);

    const body = document.createElement('div');
    body.className = 'hist-body';
    let tbl = '<table><thead><tr><th>Date</th><th>Wt</th>';
    for(let s=1;s<=e.sets;s++) tbl += '<th>S'+s+'</th>';
    tbl += '<th>Total</th></tr></thead><tbody>';
    for(const en of entries){
      tbl += '<tr><td>'+en.date+'</td><td>'+(e.type==='time'?'â±':(en.weight>0?en.weight+' lbs':'â€”'))+'</td>';
      for(let s=0;s<e.sets;s++){
        tbl += '<td class="rep">'+(en.reps[s]!==undefined?en.reps[s]:'Â·')+'</td>';
      }
      tbl += '<td class="rep">'+(e.type==='time'?'â€”':repSum(en.reps))+'</td></tr>';
    }
    tbl += '</tbody></table>';
    body.innerHTML = tbl;
    wrap.appendChild(body);
    list.appendChild(wrap);
  }

  if(exs.every(e=>(state.history[key(e.day,e.name)]||[]).length===0)){
    list.innerHTML = '<div class="empty">No progress data yet.</div>';
  }
}

async function backupData(){
  const json = JSON.stringify(state);
  const file = new File([json], 'gym_backup.json', {type:'application/json'});
  const data = {files:[file], title:'Gym Backup'};
  if(navigator.canShare && navigator.canShare(data)){
    try{ await navigator.share(data); }catch(e){ /* user cancelled */ }
  } else {
    exportData();
  }
}

function exportData(){
  const blob = new Blob([JSON.stringify(state)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'gym_backup_'+todayMMDD().replaceAll('/','-')+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importData(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      state = JSON.parse(r.result);
      save();
      location.reload();
    }catch(e){
      alert('Invalid backup file.');
    }
  };
  r.readAsText(file);
}

// ---------- Rest Timer ----------
let restTimer = null;
let restRemaining = 0;
let beepAudio = null, alarmAudio = null;

function ensureAudio(){
  if(!beepAudio){
    beepAudio = new Audio('beep.wav');
    alarmAudio = new Audio('alarm.wav');
    beepAudio.preload = 'auto';
    alarmAudio.preload = 'auto';
  }
}

function playBeep(){
  ensureAudio();
  if(beepAudio){
    beepAudio.currentTime = 0;
    beepAudio.play().catch(()=>{});
  }
}

function playAlarm(){
  ensureAudio();
  if(alarmAudio){
    alarmAudio.currentTime = 0;
    alarmAudio.play().catch(()=>{});
  }
}

function nextSetInfo(day){
  const p = PLAN[day];
  for(const ex of p.exercises){
    const k = key(day,ex.name);
    if(isExDoneToday(day, ex.name)) continue;
    const prog = state.progress[k]||[];
    if(prog.length < ex.sets){
      const weight = state.weights[k];
      let highest=null, last=null;
      if(ex.type==='reps'){
        const st = setStats(day, ex.name, prog.length, weight);
        highest = st.highest; last = st.last;
      }
      return {name:ex.name, type:ex.type, weight, setIndex:prog.length, sets:ex.sets, highest, last};
    }
  }
  return null;
}

function renderRestInfo(info){
  const el = document.getElementById('restInfo');
  if(!info){ el.innerHTML=''; return; }
  const w = info.type==='time' ? 'â± time' : (info.weight>0 ? info.weight+' lbs' : 'bodyweight');
  let hl = '';
  if(info.type==='reps'){
    hl = '<div class="rest-info-hl">highest <b>'+(info.highest!==null?info.highest:'Â·')+'</b> Â· last <b>'+(info.last!==null?info.last:'Â·')+'</b></div>';
  }
  el.innerHTML =
    '<div class="rest-info-name">'+info.name+'</div>'+
    '<div class="rest-info-sub">Set '+(info.setIndex+1)+' / '+info.sets+' Â· '+w+'</div>'+
    hl;
}

function startRestTimer(seconds){
  stopRestTimer();
  ensureAudio();
  restRemaining = seconds || 60;
  renderRestInfo(nextSetInfo(state.activeDay));
  document.getElementById('restOverlay').classList.add('show');
  updateRestNum();
  restTimer = setInterval(()=>{
    restRemaining--;
    updateRestNum();
    if(restRemaining === 3 || restRemaining === 2 || restRemaining === 1){
      playBeep();
    }
    if(restRemaining <= 0){
      stopRestTimer();
      playAlarm();
    }
  }, 1000);
}

function updateRestNum(){
  document.getElementById('restNum').textContent = restRemaining;
}

function stopRestTimer(){
  if(restTimer){ clearInterval(restTimer); restTimer = null; }
  document.getElementById('restOverlay').classList.remove('show');
}

function skipRest(){ stopRestTimer(); }

// ---------- Init ----------
const autoD = autoDay();
document.getElementById('todayLabel').textContent = 'Today: ' + todayMMDD();
state.activeDay = autoD;
renderTabs();
renderWorkout();
</script>
<canvas id="fw"></canvas>
<div class="fw-banner"><h1>&#127942; New Record!</h1><div class="fw-sub" id="fw-sub">PERSONAL BEST</div></div>
<script>
(function(){
const c=document.getElementById('fw'), x=c.getContext('2d');
let W=0,H=0;
function resize(){W=c.width=innerWidth;H=c.height=innerHeight;}
resize(); addEventListener('resize',resize);
const particles=[];
const COLORS=['#ff5f6d','#ffc371','#60a5fa','#c084fc','#34d399','#fbbf24','#f472b6','#22d3ee'];
function boom(bx,by){
const n=70;
for(let i=0;i<n;i++){
const a=Math.random()*Math.PI*2;
const sp=Math.random()*6.5+2.2;
particles.push({x:bx,y:by,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:Math.random()*0.02+0.009,r:Math.random()*2.6+1.4,c:COLORS[(Math.random()*COLORS.length)|0]});
}
}
let rafId=null;
function loop(){
x.clearRect(0,0,W,H);
for(let i=particles.length-1;i>=0;i--){
const p=particles[i];
p.x+=p.vx; p.y+=p.vy; p.vy+=0.06; p.vx*=0.985; p.vy*=0.985;
p.life-=p.decay;
if(p.life<=0){particles.splice(i,1);continue;}
x.globalAlpha=p.life;
x.fillStyle=p.c;
x.beginPath(); x.arc(p.x,p.y,p.r,0,Math.PI*2); x.fill();
}
x.globalAlpha=1;
if(particles.length>0){rafId=requestAnimationFrame(loop);}
else{x.clearRect(0,0,W,H); rafId=null;}
}
function volley(){
boom(W*0.3,H*0.50);
boom(W*0.7,H*0.52);
boom(W*0.5,H*0.46);
}
window.launchFireworks=function(bestReps){
const sub=document.getElementById('fw-sub');
if(sub && bestReps!=null) sub.textContent=bestReps+' REPS - PERSONAL BEST';
const banner=document.querySelector('.fw-banner');
if(banner) banner.style.display='block';
resize();
volley();
setTimeout(function(){boom(W*0.5,H*0.48);},500);
setTimeout(volley,1100);
setTimeout(function(){boom(W*0.6,H*0.58);},1700);
if(!rafId) rafId=requestAnimationFrame(loop);
setTimeout(function(){
particles.length=0;
x.clearRect(0,0,W,H);
if(banner) banner.style.display='none';
},3400);
};
})();
</script>
